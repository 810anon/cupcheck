name: Package and release

on:
  push:
    tags:
      - "v*"
    branches:
      - dry-run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only tag pushes upload. Manual runs and the dry-run branch package without uploading.
      - uses: BigWigsMods/packager@v2
        with:
          args: ${{ !startsWith(github.ref, 'refs/tags/') && '-d' || '' }}
